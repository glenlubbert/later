<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Later – extension settings</title>
  <style>
    body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #faf8f4; color: #1f1d1a; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    main { width: min(440px, calc(100vw - 40px)); background: #fff; border: 1px solid #e7e2d9; border-radius: 18px; padding: 28px; }
    img { width: 52px; height: 52px; border-radius: 12px; }
    h1 { font: 700 24px/1.2 "Iowan Old Style", Charter, Georgia, serif; margin: 14px 0 6px; }
    p { color: #77716a; margin: 0 0 16px; font-size: 15px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #e7e2d9; font: inherit; }
    button { height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #b5492c; color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
    #status { min-height: 22px; margin: 14px 0 0; font-size: 14.5px; color: #1f1d1a; }
    #status.bad { color: #b3261e; }
    a { color: #b5492c; }
  </style>
</head>
<body>
  <main>
    <img src="icons/128.png" alt="">
    <h1>Connect to your Later</h1>
    <p>Enter the address of your own Later site. The extension saves pages there and nowhere else.</p>
    <form id="form">
      <input id="address" type="text" inputmode="url" placeholder="read.example.com" aria-label="Your Later address" required autofocus>
      <button type="submit">Connect</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
